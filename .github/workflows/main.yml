name: TikTok Streak Bot

on:
  schedule:
    # 17:00 UTC sama dengan pukul 00:00 WIB pagi
    - cron: '0 18 * * *'
  workflow_dispatch: # Tombol manual untuk mengetes kapan saja

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install Playwright Browsers
      run: |
        python -m playwright install chromium
        python -m playwright install-deps

    - name: Jalankan Bot Streak
      run: python tes.py

    # 📸 Langkah untuk mengunggah screenshot jika terjadi kegagalan/selesai dijalankan
    - name: Unggah Screenshot Jika Gagal
      if: always() # Langkah ini akan selalu berjalan meskipun skripnya eror/gagal
      uses: actions/upload-artifact@v4
      with:
        name: tiktok-screenshots
        path: |
          gagal_*.png
          missing_*.png
          search_not_found.png
        if-no-files-found: ignore
